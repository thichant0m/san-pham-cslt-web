<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Tìm Phòng Trọ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../shared/global.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div id="header-container"></div>
    
    <main class="auth-container">
        <div class="auth-box">
            <h2>Đăng nhập</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email hoặc Số điện thoại</label>
                    <input type="text" id="login-email" placeholder="Nhập email hoặc SĐT">
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu">
                    <span class="error-message" id="password-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
            </form>
            <p class="auth-link">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../../shared/main.js"></script>
    <script src="auth.js"></script>
<script src="auth.js"></script>`n</body>
</html>
